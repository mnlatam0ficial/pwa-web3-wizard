<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Asset Protocol Console" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.svg" />
  <title>Asset Protocol</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0f172a; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
    .btn { @apply w-full py-4 rounded-2xl font-semibold text-base transition active:scale-[0.98]; }
    .btn-main { @apply bg-indigo-600 hover:bg-indigo-500 text-white; }
    .btn-sec { @apply bg-slate-700 hover:bg-slate-600 text-white; }
    .btn-ok { @apply bg-emerald-600 hover:bg-emerald-500 text-white; }
    .btn-warn { @apply bg-amber-600 hover:bg-amber-500 text-white; }
    .card { @apply bg-slate-800/90 border border-slate-700 rounded-2xl p-5; }
    .status { @apply text-sm px-4 py-3 rounded-xl; }
    .status-ok { @apply bg-emerald-900/50 text-emerald-300; }
    .status-err { @apply bg-red-900/50 text-red-300; }
    .status-info { @apply bg-slate-700/80 text-slate-300; }
    .hidden { display: none !important; }
  </style>
</head>
<body class="min-h-screen">
  <header class="sticky top-0 z-20 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-5 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-sm">AP</div>
      <span class="font-semibold text-white tracking-tight">Asset Protocol</span>
    </div>
    <div id="walletShort" class="text-xs text-slate-400 font-mono"></div>
  </header>
  <main class="max-w-md mx-auto px-5 pt-8 pb-16 space-y-6">
    <section id="sectionConnect" class="space-y-4">
      <div class="card text-center space-y-3">
        <p class="text-slate-400 text-sm">Conecta tu wallet para continuar</p>
        <button id="btnConnect" class="btn btn-main">Conectar Wallet</button>
      </div>
    </section>
    <section id="sectionConsole" class="hidden space-y-5">
      <div class="card space-y-3">
        <div class="flex justify-between text-sm"><span class="text-slate-400">Estado</span><span id="protocolStatus" class="font-medium text-amber-400">Pausado</span></div>
        <div class="flex justify-between text-sm"><span class="text-slate-400">Contrato</span><span id="contractShort" class="font-mono text-xs text-slate-300">—</span></div>
        <div class="flex justify-between text-sm"><span class="text-slate-400">Red</span><span id="networkName" class="text-slate-300">—</span></div>
      </div>
      <div class="space-y-3">
        <button id="btnDeploy" class="btn btn-main">1. Desplegar Contrato</button>
        <button id="btnEnable" class="btn btn-ok" disabled>2. Activar Protocolo</button>
        <button id="btnDisable" class="btn btn-warn hidden">Pausar Protocolo</button>
      </div>
      <div class="card space-y-3">
        <p class="text-xs text-slate-500 uppercase tracking-wider">Ajustes rápidos</p>
        <button id="btnSetFee" class="btn btn-sec text-sm py-3">Ajustar Fee (2.5% / 8%)</button>
        <button id="btnExemptSelf" class="btn btn-sec text-sm py-3">Eximir mi dirección</button>
      </div>
      <div id="statusBox" class="status status-info hidden"></div>
      <div id="resultBox" class="card hidden text-sm font-mono break-all"></div>
    </section>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.17.0/ethers.umd.min.js"></script>
  <script src="js/contracts-repo.js"></script>
  <script src="js/app.js"></script>
  <script>if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {})); }</script>
</body>
</html>
